[default]
# A model file name cut to 10 characters on purpose (`paths.rs` elide test).
extend-ignore-re = ["ggml-larg…"]

[files]
extend-exclude = ["Cargo.lock", "LICENSE-*", "*.svg"]

# Tokenizer fragments in dictionary tests are real whisper tokens, not typos.
[default.extend-words]
hel = "hel"
whis = "whis"

# Win32 NIN_* tray notification constants, "PNGs" in slint comments, and the
# deliberate misspelling "teh" used as replacement-rule test input in pipeline.rs.
teh = "teh"
NIN = "NIN"
PN = "PN"

# Whisper language codes (Faroese, Bashkir) in languages.rs and German/Spanish
# sample phrases in tuning.rs.
fo = "fo"
ba = "ba"
ein = "ein"
calle = "calle"
