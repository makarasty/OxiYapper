# cargo-deny: licences, advisories, bans, sources. Run: cargo deny check
[graph]
all-features = false
# i-slint-renderer-skia (Windows settings window) has the Slint licence exception below.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]

[advisories]
# RustSec advisories fail the check; an ignore needs an id and a reason here.
ignore = []

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense", # whisper-rs, whisper-rs-sys
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (ureq rustls)
    "0BSD", # doctest-file, recvmsg (interprocess)
]
# Slint (settings UI, ROADMAP M9) is "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR ...".
# The royalty-free licence is taken for the slint crates only; no other crate gets it.
exceptions = [
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint-build" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint-macros" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-selector" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-testing" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-winit" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-common" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-compiler" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-core" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-core-macros" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-skia" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-software" },
    { allow = ["MPL-2.0"], crate = "option-ext" }, # directories -> dirs-sys; file-level copyleft, unmodified
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls (ureq default); no system OpenSSL in the bundle.
    { name = "openssl-sys" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
