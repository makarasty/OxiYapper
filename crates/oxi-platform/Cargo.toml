[package]
name = "oxi-platform"
description = "OS code behind traits: audio capture, WAV, and per-OS hotkey/paste/tray modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
oxi-core.workspace = true
cpal.workspace = true
rtrb.workspace = true
hound.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
ab_glyph.workspace = true
interprocess.workspace = true
directories.workspace = true
tracing.workspace = true

# Win+V history: Clipboard.GetHistoryItemsAsync, DeleteItemFromHistory (Win10 1809+).
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "ApplicationModel_DataTransfer", # Clipboard, ClipboardHistoryItem, StandardDataFormats
    "Foundation",                    # IAsyncOperation, DateTime
    "Foundation_Collections",        # IVectorView
    "Win32_System_Com",              # CoInitializeEx: the clipboard calls need a COM apartment
]

# Each feature is the module of the listed API in windows-sys 0.61.2 (src/Windows/Win32/...).
[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",                # HWND, LPARAM, HANDLE, CloseHandle, GetLastError
    "Win32_Security",                  # GetTokenInformation, GetSidSubAuthority, SECURITY_ATTRIBUTES
    "Win32_Security_Authorization",    # ConvertSidToStringSidW, ConvertStringSecurityDescriptorToSecurityDescriptorW
    "Win32_Graphics_Gdi",              # CreateDIBSection, MonitorFromWindow, GetMonitorInfoW
    "Win32_Storage_FileSystem",        # FILE_FLAGS_AND_ATTRIBUTES for CreateNamedPipeW
    "Win32_System_DataExchange",       # OpenClipboard, EnumClipboardFormats, GetClipboardData, SetClipboardData, EmptyClipboard, GetClipboardSequenceNumber, RegisterClipboardFormatW
    "Win32_System_IO",                 # ConnectNamedPipe, OVERLAPPED (ReadFile/WriteFile sit in Win32_Storage_FileSystem)
    "Win32_System_LibraryLoader",      # GetModuleHandleW
    "Win32_System_Memory",             # GlobalAlloc, GlobalLock, GlobalSize
    "Win32_System_Ole",                # CF_UNICODETEXT
    "Win32_System_Pipes",              # CreateNamedPipeW
    "Win32_System_Registry",           # RegGetValueW (light or dark taskbar)
    "Win32_System_RemoteDesktop",      # WTSRegisterSessionNotification
    "Win32_System_SystemInformation",  # GetLocalTime
    "Win32_System_Threading",          # OpenProcess, QueryFullProcessImageNameW, OpenProcessToken
    "Win32_UI_HiDpi",                  # GetDpiForMonitor, SetProcessDpiAwarenessContext
    "Win32_UI_Input_KeyboardAndMouse", # SendInput, GetAsyncKeyState
    "Win32_UI_Shell",                  # SHQueryUserNotificationState, Shell_NotifyIconW, ShellExecuteW
    "Win32_UI_WindowsAndMessaging",    # SetWindowsHookExW, CallNextHookEx, UnhookWindowsHookEx, GetMessageW, PostThreadMessageW, KBDLLHOOKSTRUCT, GetForegroundWindow, GetWindowThreadProcessId, CreateWindowExW, UpdateLayeredWindow, CreateIconIndirect, CreatePopupMenu, TrackPopupMenu, SetTimer
]

[lints]
workspace = true
