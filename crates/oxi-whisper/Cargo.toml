[package]
name = "oxi-whisper"
description = "whisper.cpp wrapper: model load/unload, GPU device choice, transcription worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]

[dependencies]
oxi-core.workspace = true
whisper-rs = { workspace = true, features = ["raw-api"] } # raw-api re-exports whisper-rs-sys: ggml device list
thiserror.workspace = true

[dev-dependencies]
oxi-platform.workspace = true # WAV reader for the jfk.wav test

[lints]
workspace = true
