name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Branch protection requires one check: `ci-ok`. Gates: docs/ARCHITECTURE.md "Quality gates".
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title must look like 'fix(paste): restore clipboard after RDP paste'"; exit 1; }
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-machete,typos
      - run: cargo fmt --all --check
      - run: typos
      - run: cargo machete
      - run: cargo deny --locked check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds whisper.cpp and the Win32 code; timeout not measured cold yet.
          - { os: ubuntu-24.04, timeout: 15 }
          - { os: windows-latest, timeout: 30 }
    env:
      # Windows: a long target path breaks the nested whisper.cpp build (MAX_PATH).
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows-latest' && 'C:/t' || 'target' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        # libfontconfig-dev: Slint (backend-winit, software renderer) system fonts.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cmake clang libclang-dev libasound2-dev libfontconfig-dev
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: runner.os == 'Windows'
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Live clipboard tests need a Windows desktop session.
      - name: oxi-platform live clipboard tests
        if: runner.os == 'Windows'
        env:
          OXI_CLIPBOARD_TEST: "1"
        run: cargo nextest run --locked --profile ci -p oxi-platform

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    env:
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows-latest' && 'C:/t' || 'target' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: oxi-core has no -sys dependency
        if: runner.os == 'Linux'
        run: "! cargo tree --locked -p oxi-core -e normal --prefix none | grep -E -- '-sys v'"
      - run: cargo nextest run --locked --profile ci -p oxi-core

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # not measured cold (whisper.cpp build + 77 MB model)
    env:
      # whisper.cpp master at the time of pinning; jfk.wav is public domain.
      JFK_URL: https://raw.githubusercontent.com/ggml-org/whisper.cpp/727d3e7666485e12450746b523bfb4e7f057cc5e/samples/jfk.wav
      JFK_SHA: 59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build deps
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cmake clang libclang-dev libasound2-dev libfontconfig-dev
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Whisper regression (WER threshold on jfk.wav) runs instead of skipping: ggml-tiny.bin
      # and jfk.wav are cached and both SHA256-checked on every run; the model hash comes from
      # the model registry (one source of truth).
      - name: Read the tiny model pin from the registry
        run: |
          entry=$(grep -A6 'id: "tiny"' crates/oxi-core/src/models.rs)
          echo "TINY_URL=$(grep -oE 'https://[^"]+' <<<"$entry")" >> "$GITHUB_ENV"
          echo "TINY_SHA=$(grep -oE '[0-9a-f]{64}' <<<"$entry")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/models
          key: fixtures-${{ env.TINY_SHA }}-${{ env.JFK_SHA }}
      - name: Fetch and verify test fixtures
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/models"
          mkdir -p "$dir"
          [ -f "$dir/ggml-tiny.bin" ] || curl -fsSL --retry 3 -o "$dir/ggml-tiny.bin" "$TINY_URL"
          [ -f "$dir/jfk.wav" ] || curl -fsSL --retry 3 -o "$dir/jfk.wav" "$JFK_URL"
          echo "$TINY_SHA  $dir/ggml-tiny.bin" | sha256sum -c -
          echo "$JFK_SHA  $dir/jfk.wav" | sha256sum -c -
          echo "OXI_TINY_MODEL=$dir/ggml-tiny.bin" >> "$GITHUB_ENV"
          echo "OXI_JFK_WAV=$dir/jfk.wav" >> "$GITHUB_ENV"
      - run: cargo nextest run --locked --profile ci --workspace

  build:
    name: build (${{ matrix.os }}, ${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # timeout ~2x the cold (no cache) run measured on 2026-11-06.
          - { os: windows-latest, feature: vulkan, timeout: 25 } # 10 min cold
          - { os: ubuntu-24.04, feature: vulkan, timeout: 15 }  # 4 min cold build, apt aside
    env:
      # Windows: a long target path breaks the nested vulkan-shaders-gen build (MAX_PATH).
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows-latest' && 'C:/t' || 'target' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux too: apt took 17 min for the Vulkan packages on the first run; the SDK comes from the cache.
      - name: Install Vulkan SDK
        if: matrix.feature == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: 1.4.328.1
          install_runtime: true
          cache: true
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libclang-dev libasound2-dev libvulkan-dev libfontconfig-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.feature }}
      - run: cargo build --locked --release --features ${{ matrix.feature }}
      - name: Run binary
        shell: bash
        run: "\"$CARGO_TARGET_DIR/release/OxiYapper\" --version"

  # Informational until ROADMAP M12 (macOS): on 2026-11-06 two runs in a row never got a
  # macos-latest runner for this job ("not acquired"), which would make ci-ok fail at random.
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 25 # 1 min warm on 2026-11-06; cold not measured yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: metal
      - run: cargo build --locked --release --features metal
      - run: target/release/OxiYapper --version

  # Informational by owner decision 2026-11-06 (SPEC Models): CUDA stays, default on the owner's machine only; Vulkan is the default for others.
  # Kept out of ci-ok: a job-level continue-on-error inside the build matrix hid a cancelled macOS leg.
  build-cuda:
    runs-on: windows-latest
    timeout-minutes: 70 # 2026-11-06 cold: 11 min toolkit install + 22 min build
    env:
      CARGO_TARGET_DIR: C:/t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          # windows-latest is windows-2025-vs2026 (VS 18): CUDA 12.6 has no VS 2026 integration ("No CUDA toolset found").
          # Full install: the 13.x component names differ from 12.x, so no sub-packages list.
          cuda: 13.3.1
          method: network
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cuda
      - run: cargo build --locked --release --features cuda
      # CUDA 13 keeps its runtime DLLs in bin/x64, which is not on PATH (exit 127 without it).
      - name: Run binary
        shell: bash
        run: PATH="$(cygpath -u "$CUDA_PATH")/bin/x64:$PATH" "$CARGO_TARGET_DIR/release/OxiYapper" --version

  ci-ok:
    if: always()
    needs: [hygiene, clippy, core, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All gates passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
