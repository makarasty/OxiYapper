[package]
name = "oxi-settings"
description = "Slint settings window and first-run wizard (no Qt)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
oxi-core.workspace = true
oxi-platform.workspace = true
slint = { workspace = true, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
thiserror.workspace = true

# Native file dialog for "use my own .bin"; Windows only, so Linux CI pulls no GTK or portal.
# Skia's CPU surface draws sharper text than the software renderer (numbers at `use_skia`); the
# software renderer is the fallback (`OXI_RENDERER=software`, or when Skia fails to start).
[target.'cfg(windows)'.dependencies]
rfd.workspace = true
slint = { workspace = true, features = ["renderer-skia", "accessibility"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
tiny-skia.workspace = true

[lints]
workspace = true
