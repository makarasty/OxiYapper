name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, feature: vulkan, target: windows-x86_64-vulkan }
          - { os: windows-latest, feature: cuda, target: windows-x86_64-cuda }
          - { os: ubuntu-24.04, feature: vulkan, target: linux-x86_64-vulkan }
          - { os: macos-latest, feature: metal, target: macos-aarch64-metal }
    env:
      CARGO_TARGET_DIR: ${{ startsWith(matrix.os, 'windows') && 'C:/t' || 'target' }}
      TAG: ${{ github.ref_name }}
      NAME: oxi-yapper-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Vulkan SDK (Windows)
        if: matrix.feature == 'vulkan' && runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          vulkan_version: 1.4.328.1
          install_runtime: true
          cache: true
      - name: Install Vulkan build deps (Linux)
        if: matrix.feature == 'vulkan' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev libvulkan-dev glslc libasound2-dev
      - name: Install CUDA toolkit (Windows)
        if: matrix.feature == 'cuda'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: 12.6.3
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.feature }}
      - run: cargo build --release --features ${{ matrix.feature }}
      - name: Run binary
        shell: bash
        run: "\"$CARGO_TARGET_DIR/release/oxi-yapper\" --version"
      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/$NAME"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$NAME/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$CARGO_TARGET_DIR/release/oxi-yapper.exe" "dist/$NAME/"
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
          else
            cp "$CARGO_TARGET_DIR/release/oxi-yapper" "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          rm -rf "dist/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum oxi-yapper-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
