name: release

# A `vX.Y.Z` tag makes a release and then deletes every other release; a tag with a suffix
# (`vX.Y.Z-rc.1`) makes a pre-release and deletes every other pre-release. Automatic pre-releases
# from main are prerelease.yml. Contract: docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the Cargo.toml version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        # Semver with no leading zeros (`-rc.01` fails), as the updater parses it.
        shell: bash
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oxi-yapper") | .version')
          version=$(bash scripts/release.sh tag-version "$TAG" "$cargo_version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum OxiYapper-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --verify-tag --title "OxiYapper $TAG" --generate-notes "${flags[@]}"
      # After the create: at most one stable release and one pre-release (docs/RELEASING.md).
      - name: Delete the releases this one replaces
        shell: bash
        run: |
          gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | "\(.tagName) \(.isPrerelease)"' \
            | bash scripts/release.sh prune "$TAG" \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
